---
services:
  searchnos:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: searchnos
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - PORT=3000
      - SRC_RELAYS=${SRC_RELAYS}
      - FETCH_KINDS=${FETCH_KINDS}
      - NEGENTROPY_RELAYS=${NEGENTROPY_RELAYS}
      - NEGENTROPY_DAYS=${NEGENTROPY_DAYS}
      - SEARCH_DAYS
      - MAX_SEARCH_THREADS
      - SEARCHNOS_DB_PATH=/data
    restart: always
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - 3000:3000
    volumes:
      - searchnos-db-data:/data

volumes:
  searchnos-db-data:
    driver: local
