[package]
name = "searchnos"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nostr-sdk = "0.44.1"
tokio = { version = "1.52.3", features = ["full"] }
serde = "1.0.228"
serde_json = "1.0.149"
axum = { version = "0.8.9", features = ["ws"] }
futures = "0.3.32"
anyhow = "1.0.102"
rand = "0.10.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
unicode-normalization = "0.1.25"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
searchnos-db = { git = "https://github.com/darashi/searchnos-db" }
ndb = { package = "ndb-note-rs", git = "https://github.com/darashi/ndb-note-rs" }
indicatif = "0.18.4"
yawc = { version = "0.3.3", features = ["axum"] }
negentropy = "0.5.0"
tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
